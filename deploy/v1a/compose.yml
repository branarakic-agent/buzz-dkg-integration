name: buzz-dkg-v1a

x-runtime: &runtime
  image: node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
  working_dir: /app
  network_mode: host
  user: '${BUZZ_DKG_RUNTIME_UID:-65534}:${BUZZ_DKG_RUNTIME_GID:-65534}'
  volumes:
    - ${BUZZ_DKG_APP_DIR:?set BUZZ_DKG_APP_DIR}:/app:ro
    - ${BUZZ_DKG_STATE_DIR:?set BUZZ_DKG_STATE_DIR}:/runtime
    - ${BDI_DKG_TOKEN_PATH:?set BDI_DKG_TOKEN_PATH}:/run/secrets/dkg-auth.token:ro
  environment: &runtime-environment
    BDI_BUZZ_HTTP: ${BDI_BUZZ_HTTP:?set BDI_BUZZ_HTTP}
    BDI_BUZZ_WS: ${BDI_BUZZ_WS:?set BDI_BUZZ_WS}
    BDI_SERVICE_KEY: ${BDI_SERVICE_KEY:?set BDI_SERVICE_KEY}
    BDI_MENTION_HANDLE: ${BDI_MENTION_HANDLE:-dkg}
    BDI_MENTION_DISPLAY_NAME: ${BDI_MENTION_DISPLAY_NAME:-DKG Memory}
    BDI_DKG_API: ${BDI_DKG_API:-http://127.0.0.1:9200}
    BDI_DKG_TOKEN_PATH: /run/secrets/dkg-auth.token
    BDI_BINDINGS_PATH: /runtime/bindings.json
    BDI_PUBLISH_MODE: disabled
    BDI_MAX_PUBLISHES_PER_DAY: '0'
    BDI_AUTO_PROVISION_CHANNELS: ${BDI_AUTO_PROVISION_CHANNELS:-false}
    BDI_CONTEXT_GRAPH_ACCESS_POLICY: ${BDI_CONTEXT_GRAPH_ACCESS_POLICY:-1}
    BDI_DB_PATH: /runtime/daemon.db
    BDI_LOG_LEVEL: ${BDI_LOG_LEVEL:-info}
    BDI_QUERY_GATEWAY_ENABLED: ${BDI_QUERY_GATEWAY_ENABLED:-false}
    BDI_QUERY_GATEWAY_BIND: ${BDI_QUERY_GATEWAY_BIND:-127.0.0.1}
    BDI_QUERY_GATEWAY_PORT: ${BDI_QUERY_GATEWAY_PORT:-9296}
    BDI_QUERY_GATEWAY_TOKEN: ${BDI_QUERY_GATEWAY_TOKEN:-}
    BDI_QUERY_GATEWAY_MAX_BODY_BYTES: ${BDI_QUERY_GATEWAY_MAX_BODY_BYTES:-262144}
    BDI_QUERY_GATEWAY_TIMEOUT_MS: ${BDI_QUERY_GATEWAY_TIMEOUT_MS:-120000}
    BDI_QUERY_GATEWAY_MAX_DKG_CONCURRENT: ${BDI_QUERY_GATEWAY_MAX_DKG_CONCURRENT:-1}
    BDI_QUERY_GATEWAY_MAX_DKG_QUEUE: ${BDI_QUERY_GATEWAY_MAX_DKG_QUEUE:-32}
    BDI_QUERY_GATEWAY_CACHE_TTL_MS: ${BDI_QUERY_GATEWAY_CACHE_TTL_MS:-120000}
    BDI_QUERY_GATEWAY_MAX_CACHE_ENTRIES: ${BDI_QUERY_GATEWAY_MAX_CACHE_ENTRIES:-256}
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '3'

services:
  daemon:
    <<: *runtime
    command: ['node', '--experimental-strip-types', 'src/index.ts']
    restart: unless-stopped

  # Host side of the credential-free bridge. The relay bridge below shares the
  # adopted relay's network namespace; this process keeps the DKG gateway bound
  # strictly to host loopback and exposes it only through a private Unix socket.
  host-query-bridge:
    image: node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
    working_dir: /app
    network_mode: host
    user: '${BUZZ_DKG_RUNTIME_UID:-65534}:${BUZZ_DKG_RUNTIME_GID:-65534}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${BUZZ_DKG_APP_DIR:?set BUZZ_DKG_APP_DIR}:/app:ro
      - ${BUZZ_DKG_STATE_DIR:?set BUZZ_DKG_STATE_DIR}:/runtime
    environment:
      BDI_QUERY_BRIDGE_LISTEN_SOCKET: /runtime/query-gateway.sock
      BDI_QUERY_GATEWAY_PORT: ${BDI_QUERY_GATEWAY_PORT:-9296}
    command: ['node', 'scripts/query-bridge.mjs']
    profiles: [bridge-relay]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test -S /runtime/query-gateway.sock']
      interval: 1s
      timeout: 1s
      retries: 20
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  # Relay side of the bridge. Only the adopted relay's own network namespace
  # can reach 127.0.0.1:9297. The process carries no bearer or DKG credential.
  relay-query-bridge:
    image: node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
    working_dir: /app
    network_mode: container:${BUZZ_DKG_RELAY_CONTAINER:-buzz-relay-unconfigured}
    user: '${BUZZ_DKG_RUNTIME_UID:-65534}:${BUZZ_DKG_RUNTIME_GID:-65534}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${BUZZ_DKG_APP_DIR:?set BUZZ_DKG_APP_DIR}:/app:ro
      - ${BUZZ_DKG_STATE_DIR:?set BUZZ_DKG_STATE_DIR}:/runtime
    environment:
      BDI_QUERY_BRIDGE_BIND: 127.0.0.1
      BDI_QUERY_BRIDGE_PORT: 9297
      BDI_QUERY_BRIDGE_TARGET_SOCKET: /runtime/query-gateway.sock
    command: ['node', 'scripts/query-bridge.mjs']
    profiles: [bridge-relay]
    depends_on:
      host-query-bridge:
        condition: service_healthy
      daemon:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  bootstrap:
    <<: *runtime
    profiles: [tools]
    command: ['node', 'scripts/bootstrap/existing-relay.mjs']
    environment:
      <<: *runtime-environment
      BDI_RUNTIME_DIR_IN_CONTAINER: /runtime
      BDI_BUZZ_OWNER_KEY: ${BDI_BUZZ_OWNER_KEY:?set BDI_BUZZ_OWNER_KEY}
      BDI_CHANNEL_NAME: ${BDI_CHANNEL_NAME:-Web of Trust}
      BDI_CHANNEL_VISIBILITY: ${BDI_CHANNEL_VISIBILITY:-open}
      BDI_CHANNEL_DESCRIPTION: ${BDI_CHANNEL_DESCRIPTION:-Buzz channel with DKG-backed memory}
      BDI_CONTEXT_GRAPH_ACCESS_POLICY: ${BDI_CONTEXT_GRAPH_ACCESS_POLICY:-1}
    restart: 'no'

  smoke:
    <<: *runtime
    profiles: [tools]
    command: ['node', 'scripts/mvp-smoke.mjs']
    environment:
      <<: *runtime-environment
      BDI_MVP_STATE_DIR: /runtime
      BDI_BUZZ_OWNER_KEY: ${BDI_BUZZ_OWNER_KEY:?set BDI_BUZZ_OWNER_KEY}
    restart: 'no'
