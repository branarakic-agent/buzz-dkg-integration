name: buzz-dkg-existing-core

x-log-policy: &log-policy
  driver: local
  options:
    max-size: 10m
    max-file: '3'

x-integration: &integration
  image: buzz-dkg-integration:existing-core-mvp
  build:
    context: ../..
    dockerfile: deploy/existing-core/Dockerfile.integration
  network_mode: host
  user: '${BDI_RUNTIME_UID:-1000}:${BDI_RUNTIME_GID:-1000}'
  volumes:
    - ${BDI_RUNTIME_DIR:?set BDI_RUNTIME_DIR}:/runtime
    - ${BDI_DKG_TOKEN_PATH:?set BDI_DKG_TOKEN_PATH}:/run/secrets/dkg-auth.token:ro
  environment: &integration-environment
    BDI_BUZZ_HTTP: ${BDI_BUZZ_HTTP:?set BDI_BUZZ_HTTP}
    BDI_BUZZ_WS: ${BDI_BUZZ_WS:?set BDI_BUZZ_WS}
    BDI_SERVICE_KEY: ${BDI_SERVICE_KEY:?set BDI_SERVICE_KEY}
    BDI_MENTION_HANDLE: ${BDI_MENTION_HANDLE:-dkg}
    BDI_MENTION_DISPLAY_NAME: ${BDI_MENTION_DISPLAY_NAME:-DKG Memory}
    BDI_DKG_API: http://127.0.0.1:9200
    BDI_DKG_TOKEN_PATH: /run/secrets/dkg-auth.token
    BDI_BINDINGS_PATH: /runtime/bindings.json
    BDI_PUBLISH_MODE: disabled
    BDI_MAX_PUBLISHES_PER_DAY: '0'
    BDI_AUTO_PROVISION_CHANNELS: ${BDI_AUTO_PROVISION_CHANNELS:-false}
    BDI_CONTEXT_GRAPH_ACCESS_POLICY: ${BDI_CONTEXT_GRAPH_ACCESS_POLICY:-1}
    BDI_DB_PATH: /runtime/daemon.db
    BDI_LOG_LEVEL: ${BDI_LOG_LEVEL:-info}
    BDI_QUERY_GATEWAY_ENABLED: ${BDI_QUERY_GATEWAY_ENABLED:-false}
    BDI_QUERY_GATEWAY_BIND: ${BDI_QUERY_GATEWAY_BIND:-127.0.0.1}
    BDI_QUERY_GATEWAY_PORT: ${BDI_QUERY_GATEWAY_PORT:-9296}
    BDI_QUERY_GATEWAY_TOKEN: ${BDI_QUERY_GATEWAY_TOKEN:-}
    BDI_QUERY_GATEWAY_MAX_BODY_BYTES: ${BDI_QUERY_GATEWAY_MAX_BODY_BYTES:-262144}
    BDI_QUERY_GATEWAY_TIMEOUT_MS: ${BDI_QUERY_GATEWAY_TIMEOUT_MS:-120000}
    BDI_QUERY_GATEWAY_MAX_DKG_CONCURRENT: ${BDI_QUERY_GATEWAY_MAX_DKG_CONCURRENT:-1}
    BDI_QUERY_GATEWAY_MAX_DKG_QUEUE: ${BDI_QUERY_GATEWAY_MAX_DKG_QUEUE:-32}
    BDI_QUERY_GATEWAY_CACHE_TTL_MS: ${BDI_QUERY_GATEWAY_CACHE_TTL_MS:-120000}
    BDI_QUERY_GATEWAY_MAX_CACHE_ENTRIES: ${BDI_QUERY_GATEWAY_MAX_CACHE_ENTRIES:-256}
  logging: *log-policy

services:
  postgres:
    extends:
      file: ../buzz/compose.common.yml
      service: postgres
    command: [postgres, -c, shared_buffers=96MB, -c, max_connections=60]
    healthcheck:
      retries: 20
    networks: [buzz]
    logging: *log-policy

  redis:
    extends:
      file: ../buzz/compose.common.yml
      service: redis
    command:
      - >-
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      retries: 20
    networks: [buzz]
    logging: *log-policy

  minio:
    extends:
      file: ../buzz/compose.common.yml
      service: minio
    healthcheck:
      retries: 20
    networks: [buzz]
    logging: *log-policy

  minio-init:
    extends:
      file: ../buzz/compose.common.yml
      service: minio-init
    networks: [buzz]
    logging: *log-policy

  relay:
    extends:
      file: ../buzz/compose.common.yml
      service: relay
    environment:
      RELAY_URL: ${BDI_BUZZ_WS:?set BDI_BUZZ_WS}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?set BUZZ_RELAY_PRIVATE_KEY}
    healthcheck:
      retries: 30
    networks: [buzz]
    logging: *log-policy

  daemon:
    <<: *integration
    restart: unless-stopped

  bootstrap:
    <<: *integration
    profiles: [tools]
    command: ['node', 'deploy/existing-core/bootstrap.mjs']
    environment:
      <<: *integration-environment
      BDI_RUNTIME_DIR_IN_CONTAINER: /runtime
      BDI_BUZZ_OWNER_KEY: ${BDI_BUZZ_OWNER_KEY:?set BDI_BUZZ_OWNER_KEY}
      BDI_CHANNEL_NAME: ${BDI_CHANNEL_NAME:-Web of Trust}
      BDI_CHANNEL_VISIBILITY: ${BDI_CHANNEL_VISIBILITY:-open}
      BDI_CHANNEL_DESCRIPTION: ${BDI_CHANNEL_DESCRIPTION:-Buzz channel with DKG-backed memory}
      BDI_CONTEXT_GRAPH_ACCESS_POLICY: ${BDI_CONTEXT_GRAPH_ACCESS_POLICY:-1}
    restart: 'no'

  smoke:
    <<: *integration
    profiles: [tools]
    command: ['node', 'scripts/mvp-smoke.mjs']
    environment:
      <<: *integration-environment
      BDI_MVP_STATE_DIR: /runtime
      BDI_BUZZ_OWNER_KEY: ${BDI_BUZZ_OWNER_KEY:?set BDI_BUZZ_OWNER_KEY}
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  git-data:

networks:
  buzz:
    driver: bridge
